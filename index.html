<style>
/* ============================================
   Design Tokens
   ============================================ */
:root {
  /* Pastel palette */
  --pink-50: #fdf2f8;
  --pink-100: #fce7f3;
  --pink-200: #fbcfe8;
  --pink-400: #f472b6;
  --pink-500: #ec4899;
  --pink-600: #db2777;
  --pink-700: #be185d;

  --lavender-50: #eef2ff;
  --lavender-100: #e0e7ff;
  --lavender-200: #c7d2fe;

  --blue-50: #f0f9ff;
  --blue-100: #e0f2fe;
  --green-50: #f0fdf4;

  --slate-50: #f8fafc;
  --slate-100: #f1f5f9;
  --slate-200: #e2e8f0;
  --slate-300: #cbd5e1;
  --slate-400: #94a3b8;
  --slate-500: #64748b;
  --slate-600: #475569;
  --slate-700: #334155;
  --slate-800: #1e293b;
  --slate-900: #0f172a;

  --rose-500: #ef4444;
  --rose-50: #fef2f2;

  /* Semantic tokens */
  --color-bg: #fff;
  --color-text-primary: var(--slate-800);
  --color-text-secondary: var(--slate-500);
  --color-text-tertiary: var(--slate-400);
  --color-text-muted: var(--slate-300);
  --color-border: var(--slate-200);
  --color-border-light: var(--slate-100);

  --color-accent: var(--pink-500);
  --color-accent-hover: var(--pink-600);
  --color-accent-light: var(--pink-100);

  --color-danger: var(--rose-500);
  --color-danger-bg: var(--rose-50);

  --color-important: #f59e0b;
  --color-important-bg: #fffbeb;

  --color-completed-text: var(--slate-400);
  --color-completed-bg: var(--slate-50);

  /* Shadows */
  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
  --shadow-xl: 0 20px 60px rgba(236, 72, 153, 0.08), 0 20px 60px rgba(0, 0, 0, 0.10);
  --shadow-button: 0 4px 14px rgba(236, 72, 153, 0.30);
  --shadow-button-hover: 0 6px 20px rgba(236, 72, 153, 0.40);
  --shadow-task: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.03);
  --shadow-task-hover: 0 4px 12px rgba(0, 0, 0, 0.06), 0 2px 4px rgba(0, 0, 0, 0.04);

  /* Radii */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* Transitions */
  --ease-out: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
  --duration-fast: 150ms;
  --duration-base: 250ms;
  --duration-slow: 350ms;
}

/* Dark theme overrides */
[data-theme="dark"] {
  --color-bg: #1e293b;
  --color-text-primary: #f1f5f9;
  --color-text-secondary: #94a3b8;
  --color-text-tertiary: #64748b;
  --color-text-muted: #475569;
  --color-border: #334155;
  --color-border-light: #1e293b;

  --color-accent: #f472b6;
  --color-accent-hover: #f9a8d4;
  --color-accent-light: #4a1d3a;

  --color-danger: #f87171;
  --color-danger-bg: #3b1c1c;

  --color-important: #fbbf24;
  --color-important-bg: #3d2e0a;

  --color-completed-text: #64748b;
  --color-completed-bg: #0f172a;

  --shadow-xs: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.4);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.4);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.4);
  --shadow-xl: 0 20px 60px rgba(0,0,0,0.5);
  --shadow-button: 0 4px 14px rgba(244,114,182,0.25);
  --shadow-button-hover: 0 6px 20px rgba(244,114,182,0.35);
  --shadow-task: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-task-hover: 0 4px 12px rgba(0,0,0,0.4);
}

[data-theme="dark"] body {
  background: linear-gradient(135deg, #1a0a20 0%, #0f172a 50%, #0a1a10 100%);
}

[data-theme="dark"] .container {
  background: rgba(30, 41, 59, 0.9);
  border-color: rgba(255,255,255,0.08);
}

[data-theme="dark"] .header {
  background: linear-gradient(135deg, rgba(74,29,58,0.6) 0%, rgba(30,41,59,0.6) 50%, rgba(10,26,16,0.4) 100%);
}

[data-theme="dark"] .input-wrapper input {
  background: #0f172a;
  color: #f1f5f9;
}

[data-theme="dark"] .input-wrapper input:focus {
  background: #1e293b;
}

[data-theme="dark"] .footer {
  background: #0f172a;
}

[data-theme="dark"] .task-list-wrapper::-webkit-scrollbar-thumb {
  background: #334155;
}

[data-theme="dark"] .btn-footer {
  background: #1e293b;
}

[data-theme="dark"] .badge-remind {
  color: #a78bfa;
  background: #2e1a4a;
  border-color: rgba(167, 139, 250, 0.2);
}

[data-theme="dark"] .btn-remind:hover {
  background: rgba(244, 114, 182, 0.15);
  color: var(--pink-400);
}

[data-theme="dark"] .reminder-popover {
  background: #1e293b;
  border-color: #334155;
}

[data-theme="dark"] .reminder-popover button:hover {
  background: rgba(244, 114, 182, 0.2);
}

/* Theme toggle */
.btn-theme {
  position: absolute;
  top: 24px; right: 24px;
  width: 36px; height: 36px;
  border: none;
  background: rgba(255,255,255,0.3);
  backdrop-filter: blur(4px);
  border-radius: var(--radius-full);
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--duration-fast) var(--ease-out);
  line-height: 1;
  z-index: 1;
}
.btn-theme:hover {
  background: rgba(255,255,255,0.5);
  transform: scale(1.1);
}
[data-theme="dark"] .btn-theme {
  background: rgba(255,255,255,0.1);
}

/* ============================================
   Base & Reset
   ============================================ */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #fdf2f8 0%, #e0f2fe 50%, #f0fdf4 100%);
  background-attachment: fixed;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 48px 16px;
  color: var(--color-text-primary);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

/* ============================================
   Container
   ============================================ */
.container {
  width: 100%;
  max-width: 500px;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-xl);
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.6);
}

/* ============================================
   Header
   ============================================ */
.header {
  background: linear-gradient(135deg, rgba(252, 231, 243, 0.9) 0%, rgba(224, 231, 255, 0.9) 50%, rgba(240, 253, 244, 0.7) 100%);
  padding: 28px 28px 22px;
  position: relative;
  overflow: hidden;
}

.header::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -30%;
  width: 200px;
  height: 200px;
  background: radial-gradient(circle, rgba(236, 72, 153, 0.08) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
}

.header h1 {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--pink-700);
  line-height: 1.3;
  position: relative;
}

.header p {
  font-size: 13px;
  color: var(--color-text-secondary);
  margin-top: 4px;
  font-weight: 400;
  position: relative;
}

/* ============================================
   Input Section
   ============================================ */
.input-section {
  display: flex;
  gap: 10px;
  padding: 18px 24px 16px;
  background: var(--color-bg);
  border-bottom: 1px solid var(--color-border-light);
}

.input-wrapper {
  flex: 1;
  position: relative;
}

.input-wrapper input {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid var(--color-border);
  border-radius: var(--radius-md);
  font-size: 15px;
  color: var(--color-text-primary);
  outline: none;
  transition: border-color var(--duration-fast) var(--ease-out),
              box-shadow var(--duration-fast) var(--ease-out);
  background: var(--slate-50);
  font-family: inherit;
}

.input-wrapper input:focus {
  border-color: var(--color-accent);
  box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.12);
  background: #fff;
}

.input-wrapper input::placeholder {
  color: var(--color-text-tertiary);
  font-weight: 400;
}

.btn-add {
  padding: 12px 22px;
  background: linear-gradient(135deg, var(--pink-500), var(--pink-600));
  color: #fff;
  border: none;
  border-radius: var(--radius-md);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: transform var(--duration-fast) var(--ease-out),
              box-shadow var(--duration-fast) var(--ease-out),
              opacity var(--duration-fast) var(--ease-out);
  white-space: nowrap;
  letter-spacing: 0.3px;
  box-shadow: var(--shadow-button);
  position: relative;
  overflow: hidden;
  font-family: inherit;
}

.btn-add:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow-button-hover);
}

.btn-add:active {
  transform: translateY(0) scale(0.97);
  box-shadow: var(--shadow-button);
}

.btn-add:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

/* Ripple effect container */
.btn-add::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
  opacity: 0;
  transition: opacity var(--duration-fast) var(--ease-out);
}

.btn-add:hover::after {
  opacity: 1;
}

/* ============================================
   Task List Area
   ============================================ */
.task-list-wrapper {
  max-height: 420px;
  overflow-y: auto;
  overflow-x: hidden;
  scroll-behavior: smooth;
}

/* Custom scrollbar */
.task-list-wrapper::-webkit-scrollbar {
  width: 5px;
}

.task-list-wrapper::-webkit-scrollbar-track {
  background: transparent;
}

.task-list-wrapper::-webkit-scrollbar-thumb {
  background: var(--slate-200);
  border-radius: var(--radius-full);
}

.task-list-wrapper::-webkit-scrollbar-thumb:hover {
  background: var(--slate-300);
}

.task-list {
  list-style: none;
  padding: 6px 16px;
  min-height: 60px;
  overflow-x: hidden;
}

/* ============================================
   Task Item
   ============================================ */
.task-list li {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  content-visibility: auto;
  contain-intrinsic-size: 60px;
  margin: 4px 0;
  border-radius: var(--radius-md);
  background: var(--color-bg);
  border: 1px solid transparent;
  box-shadow: var(--shadow-task);
  transition: opacity var(--duration-base) var(--ease-out),
              transform var(--duration-base) var(--ease-out),
              box-shadow var(--duration-base) var(--ease-out),
              border-color var(--duration-base) var(--ease-out);
  position: relative;
}

.task-list li:hover {
  box-shadow: var(--shadow-task-hover);
  border-color: var(--color-border-light);
}

/* Entry animation */
@keyframes taskSlideIn {
  0% {
    opacity: 0;
    transform: translateY(-12px) scale(0.96);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.task-list li.task-enter {
  animation: taskSlideIn 0.35s var(--ease-bounce) forwards;
}

/* Drag to reorder */
.task-list li[draggable="true"] {
  cursor: grab;
}
.task-list li[draggable="true"]:active {
  cursor: grabbing;
}
.task-list li.dragging {
  opacity: 0.4;
}
.task-list li.drag-over {
  border-top: 2px solid var(--color-accent);
}

/* Completed state */
.task-list li.completed {
  background: var(--color-completed-bg);
  border-color: var(--color-border-light);
}

.task-list li.completed:hover {
  border-color: var(--color-border);
}

/* ============================================
   Checkbox
   ============================================ */
.checkbox {
  flex-shrink: 0;
  width: 24px;
  height: 24px;
  border: 2px solid var(--slate-300);
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--duration-base) var(--ease-out);
  background: transparent;
  position: relative;
}

.checkbox:hover {
  border-color: var(--color-accent);
  background: var(--pink-50);
  transform: scale(1.05);
}

.checkbox:active {
  transform: scale(0.92);
}

.checkbox svg {
  width: 13px;
  height: 13px;
}

.checkbox svg polyline {
  stroke-dasharray: 18;
  stroke-dashoffset: 18;
  transition: stroke-dashoffset var(--duration-base) var(--ease-out);
}

li.completed .checkbox {
  background: var(--color-accent);
  border-color: var(--color-accent);
}

li.completed .checkbox:hover {
  background: var(--color-accent-hover);
  border-color: var(--color-accent-hover);
}

li.completed .checkbox svg polyline {
  stroke-dashoffset: 0;
}

/* ============================================
   Task Content
   ============================================ */
.task-content {
  flex: 1;
  min-width: 0;
}

.task-text {
  font-size: 15px;
  color: var(--color-text-primary);
  word-break: break-word;
  line-height: 1.5;
  transition: color var(--duration-base) var(--ease-out);
  position: relative;
}

li.completed .task-text {
  color: var(--color-completed-text);
}

li.completed .task-text::after {
  content: '';
  position: absolute;
  left: 0;
  top: 50%;
  width: 100%;
  height: 1.5px;
  background: var(--slate-300);
  border-radius: 1px;
  transform: translateY(-50%);
  animation: strikeThrough 0.35s var(--ease-out) forwards;
}

@keyframes strikeThrough {
  from { width: 0; }
  to { width: 100%; }
}

.task-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 2px;
  flex-wrap: wrap;
}

.task-time {
  font-size: 12px;
  color: var(--color-text-tertiary);
  font-weight: 400;
  letter-spacing: 0.2px;
}

/* ============================================
   Badge - Important
   ============================================ */
.badge-important {
  font-size: 10px;
  font-weight: 600;
  color: #d97706;
  background: var(--color-important-bg);
  padding: 1px 8px;
  border-radius: var(--radius-full);
  white-space: nowrap;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  border: 1px solid rgba(245, 158, 11, 0.15);
  line-height: 1.6;
}

.badge-remind {
  font-size: 10px;
  font-weight: 600;
  color: #7c3aed;
  background: #f5f3ff;
  padding: 1px 8px;
  border-radius: var(--radius-full);
  white-space: nowrap;
  letter-spacing: 0.3px;
  border: 1px solid rgba(124, 58, 237, 0.15);
  line-height: 1.6;
}

/* ============================================
   Buttons - Important & Delete
   ============================================ */
.btn-important {
  flex-shrink: 0;
  width: 32px;
  height: 32px;
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--duration-fast) var(--ease-out);
  color: var(--slate-300);
  padding: 0;
}

.btn-important:hover {
  color: var(--color-important);
  background: var(--color-important-bg);
  transform: scale(1.1);
}

.btn-important:active {
  transform: scale(0.92);
}

.btn-important.active {
  color: var(--color-important);
}

.btn-important.active:hover {
  color: #d97706;
  background: var(--color-important-bg);
}

/* --- Bell / Reminder Button --- */
.btn-remind {
  flex-shrink: 0;
  width: 32px; height: 32px;
  border: none;
  background: transparent;
  cursor: pointer;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--duration-fast) var(--ease-out);
  color: var(--slate-300);
  padding: 0;
  position: relative;
}
.btn-remind:hover {
  color: var(--pink-400);
  background: var(--pink-50);
  transform: scale(1.1);
}
.btn-remind.active {
  color: var(--pink-500);
}

.reminder-popover {
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  padding: 6px;
  display: none;
  z-index: 10;
  white-space: nowrap;
  min-width: 120px;
}
.reminder-popover.show {
  display: block;
}
.reminder-popover button {
  display: block;
  width: 100%;
  padding: 6px 12px;
  border: none;
  background: none;
  cursor: pointer;
  font-size: 13px;
  color: var(--color-text-primary);
  border-radius: var(--radius-sm);
  text-align: left;
  font-family: inherit;
}
.reminder-popover button:hover {
  background: var(--color-accent-light);
}
.reminder-popover .reminder-clear {
  color: var(--color-text-tertiary);
  font-size: 12px;
}

.btn-delete {
  flex-shrink: 0;
  width: 32px;
  height: 32px;
  border: none;
  background: transparent;
  color: var(--slate-300);
  cursor: pointer;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--duration-fast) var(--ease-out);
  font-size: 16px;
  padding: 0;
  opacity: 0;
  pointer-events: none;
}

.task-list li:hover .btn-delete,
.task-list li:focus-within .btn-delete,
.btn-delete:focus-visible {
  opacity: 1;
  pointer-events: auto;
}

.btn-delete:hover {
  color: var(--color-danger);
  background: var(--color-danger-bg);
  transform: scale(1.1);
}

.btn-delete:active {
  transform: scale(0.92);
}

/* ============================================
   Empty State
   ============================================ */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 56px 32px 48px;
  color: var(--color-text-tertiary);
  text-align: center;
  user-select: none;
}

.empty-state-illustration {
  position: relative;
  width: 96px;
  height: 96px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.empty-state-illustration svg {
  width: 80px;
  height: 80px;
  opacity: 0.35;
  animation: float 4s var(--ease-bounce) infinite;
}

@keyframes float {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-8px);
  }
}

.empty-state h2 {
  font-size: 16px;
  font-weight: 600;
  color: var(--color-text-secondary);
  margin-bottom: 6px;
}

.empty-state p {
  font-size: 13px;
  color: var(--color-text-tertiary);
  max-width: 220px;
  line-height: 1.5;
}

/* ============================================
   Footer
   ============================================ */
.footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 24px;
  border-top: 1px solid var(--color-border-light);
  background: var(--slate-50);
  gap: 16px;
  transition: all var(--duration-base) var(--ease-out);
}

.footer-left {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--color-text-secondary);
  font-size: 13px;
  font-weight: 500;
}

.footer-left .count-number {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 22px;
  height: 22px;
  padding: 0 6px;
  background: var(--pink-100);
  color: var(--pink-600);
  border-radius: var(--radius-full);
  font-size: 12px;
  font-weight: 700;
}

.footer-left .count-label {

/* ============================================
   Time Formatting
   ============================================ */
function formatTime(ts) {
  const seconds = Math.floor((Date.now() - ts) / 1000);
  if (seconds < 60) return '刚刚';
  const minutes = Math.floor(seconds / 60);
  if (minutes < 60) return `${minutes} 分钟前`;
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return `${hours} 小时前`;
  const days = Math.floor(hours / 24);
  if (days < 30) return `${days} 天前`;
  const d = new Date(ts);
  const month = d.getMonth() + 1;
  const day = d.getDate();
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  return `${month}月${day}日 ${hh}:${mm}`;
}

  checkbox.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {

  // --- Task Content ---

  const timeDiv = document.createElement('div');

  taskMeta.appendChild(timeDiv);

  if (task.important) {
    const badge = document.createElement('span');

  if (task.remindAt) {

    taskMeta.appendChild(remindBadge);
  }

  taskContent.append(taskText, taskMeta);

  // --- Important Button ---
  const btnImportant = document.createElement('button');
  btnImportant.className = 'btn-important' + (task.important ? ' active' : '');
  btnImportant.setAttribute('aria-label', task.important ? '取消重要标记' : '标记为重要');
  btnImportant.innerHTML = task.important ? STAR_FILLED : STAR_OUTLINE;
  btnImportant.addEventListener('click', () => toggleImportant(task.id));

  // --- Reminder Button ---
  const btnRemind = document.createElement('button');
  btnRemind.className = 'btn-remind' + (task.remindAt ? ' active' : '');
  btnRemind.setAttribute('aria-label', '设置提醒');
  btnRemind.innerHTML = BELL_SVG;

  let remindPopover = null;

  function openRemindPopover() {
    if (remindPopover) { remindPopover.remove(); remindPopover = null; return; }
    const div = document.createElement('div');
    div.className = 'reminder-popover show';
    div.innerHTML = `
      <button data-min="30">30 分钟后</button>
      <button data-min="60">1 小时后</button>

      <button data-min="540">明天 9:00</button>
      <button class="reminder-clear" data-min="0">清除提醒</button>
    `;
    document.body.appendChild(div);
    const rect = btnRemind.getBoundingClientRect();
    const top = rect.top - div.offsetHeight - 4;

    div.style.top = Math.max(4, top) + 'px';
    div.style.left = Math.max(4, left) + 'px';

/* ============================================
   Smooth Container Height Transition (WAAPI)
   ============================================ */
function smoothHeightChange(mutate) {
  _cancelContainerAnim();

  const wrapper = taskList.closest('.task-list-wrapper');
  const wrapperOverflow = wrapper.style.overflowY;

  const oldH = container.offsetHeight;
  container.style.height = oldH + 'px';
  container.style.transition = 'none';
  container.offsetHeight; // force layout commit

  mutate();

  // Suppress scrollbar during animation — prevents content-width reflow
  wrapper.style.overflowY = 'hidden';

  requestAnimationFrame(() => {
    container.style.height = '';
    const newH = container.scrollHeight;
    if (newH === oldH) {
      container.style.transition = '';
      wrapper.style.overflowY = wrapperOverflow || '';
      return;
    }

    container.style.height = oldH + 'px';
    container.offsetHeight; // re-lock
    container.style.contain = 'layout style paint';
    container.style.willChange = 'height';

    const anim = container.animate([
      { height: oldH + 'px' },
      { height: newH + 'px' }
    ], {
      duration: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 300,
      easing: 'cubic-bezier(0.4, 0, 0.2, 1)',
      fill: 'none'
    });

    _containerAnim = anim;

    function cleanup() {
      if (_containerAnim === anim) _containerAnim = null;
      container.style.height = '';
      container.style.transition = '';
      container.style.contain = '';
      container.style.willChange = '';
      wrapper.style.overflowY = wrapperOverflow || '';
    }

    anim.onfinish = cleanup;
    anim.oncancel = cleanup;
  });
}

/* ============================================
   Append Task to DOM (with animation)

function onTaskEnterEnd(li) {
  li.addEventListener('animationend', function handler() {
    li.classList.remove('task-enter');
    li.removeEventListener('animationend', handler);
  }, { once: true });
}

function appendTaskToDOM(task) {
  const li = createTaskElement(task);
  li.classList.add('task-enter');
  taskList.appendChild(li);
  updateUI();
  scrollToBottom();

  onTaskEnterEnd(li);
}

function scrollToBottom() {

  if (wrapper) {
    wrapper.scrollTop = wrapper.scrollHeight;
  }
}

// --- Add Task ---
async function addTask(text) {
  text = text.trim().replace(/[\u200B-\u200D\uFEFF\u2060]/g, '');
  if (!text) return;
  if (text.length > TASK_MAX_LENGTH) { handleError(null, '任务内容不能超过200个字符'); return; }

  const task = {
    id: Date.now() * 1000 + Math.floor(Math.random() * 1000),
    text,
    completed: false,
    createdAt: Date.now(),
    important: false,
    remindAt: null
  };

  tasks.push(task);
  smoothHeightChange(() => {
    appendTaskToDOM(task);
  });
  taskInput.value = '';
  taskInput.focus();

  _realtimeIgnore = true;
  const { error } = await db.from('tasks').insert({
    id: task.id, text: task.text, completed: task.completed,
    important: task.important, created_at: task.createdAt, position: tasks.length - 1
  });
  setTimeout(() => { _realtimeIgnore = false; }, 100);
  if (error) {
    tasks = tasks.filter(t => t.id !== task.id);
    const li = taskList.querySelector(`[data-id="${task.id}"]`);
    if (li) li.remove();
    updateUI();
    handleError(error, '添加失败');
  }
}

// --- Toggle Completed ---
async function toggleCompleted(id) {
  const task = tasks.find(t => t.id === id);
  if (!task) return;

  const prev = task.completed;
  task.completed = !task.completed;

  const li = taskList.querySelector(`[data-id="${id}"]`);
  if (li) {
    li.classList.toggle('completed');
    const checkbox = li.querySelector('.checkbox');
    if (checkbox) {
      checkbox.setAttribute('aria-checked', task.completed ? 'true' : 'false');
    }
  }

  updateFooter();

  _realtimeIgnore = true;
  const { error } = await db.from('tasks').update({ completed: task.completed }).eq('id', id);
  setTimeout(() => { _realtimeIgnore = false; }, 100);
  if (error) {
    task.completed = prev;
    if (li) {
      li.classList.toggle('completed');
      const checkbox = li.querySelector('.checkbox');
      if (checkbox) checkbox.setAttribute('aria-checked', prev ? 'true' : 'false');
    }
    updateFooter();
    handleError(error, '更新失败');
  }
}

// --- Toggle Important ---
async function toggleImportant(id) {
  const task = tasks.find(t => t.id === id);
  if (!task) return;

  const prev = task.important;
  task.important = !task.important;

  const li = taskList.querySelector(`[data-id="${id}"]`);
  if (!li) { task.important = prev; return; }

  const btn = li.querySelector('.btn-important');
  if (btn) {
    btn.classList.toggle('active');
    btn.setAttribute('aria-label', task.important ? '取消重要标记' : '标记为重要');
    btn.innerHTML = task.important ? STAR_FILLED : STAR_OUTLINE;
  }

  const meta = li.querySelector('.task-meta');
  const existingBadge = meta ? meta.querySelector('.badge-important') : null;
  if (task.important && meta && !existingBadge) {
    const badge = document.createElement('span');
    badge.className = 'badge-important';
    badge.textContent = '重要';
    meta.appendChild(badge);
  } else if (!task.important && existingBadge) {
    existingBadge.remove();
  }

  _realtimeIgnore = true;
  const { error } = await db.from('tasks').update({ important: task.important }).eq('id', id);
  setTimeout(() => { _realtimeIgnore = false; }, 100);
  if (error) {
    task.important = prev;
    if (li) {
      if (btn) {
        btn.classList.toggle('active');
        btn.setAttribute('aria-label', prev ? '取消重要标记' : '标记为重要');
        btn.innerHTML = prev ? STAR_FILLED : STAR_OUTLINE;
      }
      const badge = meta ? meta.querySelector('.badge-important') : null;
      if (prev && meta && !badge) {
        const b = document.createElement('span');
        b.className = 'badge-important';
        b.textContent = '重要';
        meta.appendChild(b);
      } else if (!prev && badge) {
        badge.remove();
      }
    }
    handleError(error, '更新失败');
  }
}

// --- Delete Task (fade-then-shrink with WAAPI) ---
async function deleteTask(id) {
  const li = taskList.querySelector(`[data-id="${id}"]`);
  if (!li) return;
  if (li.dataset._deleting) return;
  li.dataset._deleting = 'true';

  const idx = tasks.findIndex(t => t.id === id);
  if (idx === -1) return;
  const removed = tasks.splice(idx, 1)[0];

  // Fire Supabase delete in background — rollback on failure
  _realtimeIgnore = true;
  db.from('tasks').delete().eq('id', id).then(({ error: delErr }) => {
    setTimeout(() => { _realtimeIgnore = false; }, 100);
    if (delErr) {
      tasks.splice(idx, 0, removed);
      render();
      handleError(delErr, '删除失败');
    }
  });

  _cancelContainerAnim();

  // Phase 1: Fade out the task item (GPU-composited)
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    li.style.willChange = 'opacity, transform';
    const fadeAnim = li.animate([
      { opacity: 1, transform: 'scale(1)' },
      { opacity: 0, transform: 'scale(0.92)' }
    ], { duration: 200, easing: 'ease-out', fill: 'forwards' });
    await fadeAnim.finished.catch(() => {});
  }

  // Phase 2: Remove from DOM and shrink container
  const oldH = container.offsetHeight;
  const wrapper = taskList.closest('.task-list-wrapper');
  const wrapperOverflow = wrapper.style.overflowY;
  wrapper.style.overflowY = 'hidden';

  li.remove();
  const newH = container.offsetHeight;

  if (oldH === newH) {
    wrapper.style.overflowY = wrapperOverflow || '';
    updateUI();
    showUndoToast(removed);
    return;
  }

  container.style.height = oldH + 'px';
  container.style.transition = 'none';
  container.style.contain = 'layout style paint';
  container.style.willChange = 'height';
  container.offsetHeight; // force layout

  const anim = container.animate([
    { height: oldH + 'px' },
    { height: newH + 'px' }
  ], { duration: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 250, easing: 'ease-out', fill: 'none' });

  _containerAnim = anim;

  function cleanup() {
    if (_containerAnim === anim) _containerAnim = null;
    container.style.height = '';
    container.style.transition = '';
    container.style.contain = '';
    container.style.willChange = '';
    wrapper.style.overflowY = wrapperOverflow || '';
    updateUI();
    showUndoToast(removed);
  }

  anim.onfinish = cleanup;
  anim.oncancel = cleanup;
}

// --- Clear Completed (fade-then-shrink, no full re-render) ---
async function clearCompleted() {
  if (!tasks.some(t => t.completed)) return;
  const removed = tasks.filter(t => t.completed);
  const ids = removed.map(t => t.id);

  // Phase 1: Fade out completed items (GPU-composited opacity + transform)
  const completedLis = [...taskList.querySelectorAll('li.completed')];
  if (completedLis.length === 0) return;

  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const delayPerItem = Math.min(30, Math.floor(200 / completedLis.length));
    const fadeOuts = completedLis.map((li, i) => {
      li.style.willChange = 'opacity, transform';
      return li.animate([
        { opacity: 1, transform: 'scale(1)' },
        { opacity: 0, transform: 'scale(0.95)' }
      ], {
        duration: 200, delay: i * delayPerItem,
        easing: 'ease-out', fill: 'forwards'
      }).finished.catch(() => {});
    });
    await Promise.all(fadeOuts);
  }

  // Phase 2: Remove from state
  tasks = tasks.filter(t => !t.completed);

  // Phase 3: Remove from DOM and shrink container
  smoothHeightChange(() => { completedLis.forEach(li => li.remove()); });

  const { error: clrErr } = await db.from('tasks').delete().in('id', ids);
  if (clrErr) {
    tasks.push(...removed);
    render();
    handleError(clrErr, '清除失败');
  }
}

// --- Delete All (bulk, uses re-render) ---
async function deleteAll() {
  if (tasks.length === 0) return;
  if (!confirm('确定要删除所有任务吗？此操作不可恢复。')) return;
  if (prompt('请输入 DELETE 确认：') !== 'DELETE') return;
  const snapshot = [...tasks];
  tasks = [];
  smoothHeightChange(() => { render(); });
  const { error: allErr } = await db.from('tasks').delete().neq('id', 0);
  if (allErr) {
    tasks = snapshot;
    render();
    handleError(allErr, '全部删除失败');
  }
}

/* ============================================
   UI State Updates
   ============================================ */
function updateUI() { updateEmptyState(); updateFooter(); }

function updateEmptyState() {
  if (tasks.length === 0) {
    emptyState.style.display = 'flex';
    emptyTitle.textContent = '开始记录吧';
    emptyDesc.innerHTML = '添加你的第一项任务，<br>让每一天都井井有条';
  } else {
    emptyState.style.display = 'none';
  }
}

function updateFooter() {
  if (tasks.length === 0) {
    footer.style.display = 'none';
    return;
  }

  footer.style.display = 'flex';
  let remaining = 0;
  for (const t of tasks) { if (!t.completed) remaining++; }
  const hasCompleted = remaining < tasks.length;

  if (remaining === 0) {
    countNumber.textContent = '✓';
    countLabel.textContent = '全部完成';
    countNumber.style.background = '#d1fae5';
    countNumber.style.color = '#059669';
  } else {
    countNumber.textContent = remaining;
    countLabel.textContent = '项待完成';
    countNumber.style.background = '';
    countNumber.style.color = '';
  }

  btnClearCompleted.disabled = !hasCompleted;
}

/* ============================================
   Full Render (initial load & bulk ops)
   ============================================ */
function render(animate = true) {
  taskList.innerHTML = '';
  tasks.forEach((task, i) => {
    const li = createTaskElement(task);
    if (animate) {
      li.classList.add('task-enter');
      li.style.animationDelay = `${Math.min(i, 20) * (ANIM_STAGGER_MS / 1000)}s`;
      onTaskEnterEnd(li);
    }
    taskList.appendChild(li);
  });
  updateUI();
}

/* ============================================
   Event Binding
   ============================================ */
btnAdd.addEventListener('click', () => addTask(taskInput.value));

taskInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addTask(taskInput.value);
});

btnClearCompleted.addEventListener('click', clearCompleted);
btnDeleteAll.addEventListener('click', deleteAll);

/* ============================================
   Drag to Reorder
   ============================================ */
let _dragSrc = null;

taskList.addEventListener('dragstart', (e) => {
  const li = e.target.closest('li');
  if (!li) { e.preventDefault(); return; }
  _dragSrc = li;
  li.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
});

taskList.addEventListener('dragover', (e) => {
  e.preventDefault();
  const li = e.target.closest('li');
  if (!li || li === _dragSrc) return;
  li.classList.add('drag-over');
});

taskList.addEventListener('dragleave', (e) => {
  const li = e.target.closest('li');
  if (li) li.classList.remove('drag-over');
});

taskList.addEventListener('drop', (e) => {
  e.preventDefault();
  const targetLi = e.target.closest('li');
  if (!targetLi || !_dragSrc || targetLi === _dragSrc) return;
  targetLi.classList.remove('drag-over');
  _dragSrc.classList.remove('dragging');

  const srcId = Number(_dragSrc.dataset.id);
  const dstId = Number(targetLi.dataset.id);
  const srcIdx = tasks.findIndex(t => t.id === srcId);
  const dstIdx = tasks.findIndex(t => t.id === dstId);
  if (srcIdx === -1 || dstIdx === -1) return;
  const [moved] = tasks.splice(srcIdx, 1);
  tasks.splice(dstIdx, 0, moved);

  render(false);
  tasks.forEach((t, i) => {
    db.from('tasks').update({ position: i }).eq('id', t.id);
  });
  _dragSrc = null;
});

/* ============================================
   Theme Toggle
   ============================================ */
function getTheme() {
  const saved = localStorage.getItem('theme');
  if (saved) return saved;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

function applyTheme(theme) {
  const icon = document.getElementById('btnTheme');
  if (theme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    if (icon) icon.textContent = '☀️';
  } else {
    document.documentElement.removeAttribute('data-theme');
    if (icon) icon.textContent = '🌙';
  }
  localStorage.setItem('theme', theme);
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  applyTheme(current === 'dark' ? 'light' : 'dark');
}

document.getElementById('btnTheme').addEventListener('click', toggleTheme);

// Close all reminder popovers on outside click
document.addEventListener('click', () => {
  document.querySelectorAll('.reminder-popover.show').forEach(p => p.remove());
});

/* ============================================
   Undo Delete Toast
   ============================================ */
function showUndoToast(task) {
  const toast = document.createElement('div');
  toast.className = 'undo-toast';
  toast.innerHTML = `已删除「${task.text}」<button>撤销</button>`;
  document.body.appendChild(toast);

  const timer = setTimeout(() => {
    toast.remove();
  }, 3000);

  toast.querySelector('button').addEventListener('click', () => {
    clearTimeout(timer);
    toast.remove();
    tasks.push(task);
    smoothHeightChange(() => appendTaskToDOM(task));
    db.from('tasks').insert({
      id: task.id, text: task.text, completed: task.completed,
      important: task.important, created_at: task.createdAt
    });
  });
}

/* ============================================
   Notifications / Reminders
   ============================================ */
const notifTimers = {};

function getTomorrow9AM() {
  const d = new Date();
  d.setDate(d.getDate() + 1);
  d.setHours(9, 0, 0, 0);
  return d.getTime();
}

function formatRemindTime(ts) {
  const d = new Date(ts);
  const now = new Date();
  const isTomorrow = d.getDate() !== now.getDate() && d > now;
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  return isTomorrow ? `明天 ${hh}:${mm}` : `${hh}:${mm}`;
}

let _notifPerm = false;

async function ensureNotifPermission() {
  if (_notifPerm) return true;
  if (!('Notification' in window)) return false;
  if (Notification.permission === 'granted') { _notifPerm = true; return true; }
  if (Notification.permission === 'denied') return false;
  const granted = await Notification.requestPermission();
  _notifPerm = granted === 'granted';
  return _notifPerm;
}

function scheduleNotification(id, text, remindAt) {
  clearTimeout(notifTimers[id]);
  if (!remindAt) return;
  const delay = remindAt - Date.now();
  if (delay <= 0) return;
  notifTimers[id] = setTimeout(() => {
    if (Notification.permission === 'granted') {
      const n = new Notification('待办提醒', { body: text, icon: 'icon-192x192.png', tag: 'todo-remind', requireInteraction: true });
      n.addEventListener('click', () => { clients.openWindow('/TODO-APP/'); });
    }
    delete notifTimers[id];
  }, delay);
}

async function setReminder(id, remindAt) {
  const task = tasks.find(t => t.id === id);
  if (!task) return;
  task.remindAt = remindAt;

  // Selective DOM update — no full re-render
  const li = taskList.querySelector(`[data-id="${id}"]`);
  if (li) {
    const btn = li.querySelector('.btn-remind');
    if (btn) {
      if (remindAt) btn.classList.add('active');
      else btn.classList.remove('active');
    }
    const meta = li.querySelector('.task-meta');
    if (meta) {
      const old = meta.querySelector('.badge-remind');
      if (old) old.remove();
      if (remindAt) {
        const badge = document.createElement('span');
        badge.className = 'badge-remind';
        badge.textContent = '⏰ ' + formatRemindTime(remindAt);
        meta.appendChild(badge);
      }
    }
  }

  if (remindAt) {
    await ensureNotifPermission();
    scheduleNotification(id, task.text, remindAt);
  } else {
    clearTimeout(notifTimers[id]);
    delete notifTimers[id];
  }
  _realtimeIgnore = true;
  db.from('tasks').update({ remind_at: remindAt ? new Date(remindAt).toISOString() : null }).eq('id', id)
    .finally(() => setTimeout(() => { _realtimeIgnore = false; }, 100));
}

/* ============================================
   Init
   ============================================ */
(async function init() {
  applyTheme(getTheme());
  await sync();

  // Re-schedule pending reminders from loaded tasks
  await ensureNotifPermission();
  tasks.forEach(t => {
    if (t.remindAt && t.remindAt > Date.now()) {
      scheduleNotification(t.id, t.text, t.remindAt);
    } else if (t.remindAt && t.remindAt <= Date.now()) {
      // Expired reminder — clear it
      t.remindAt = null;
    }
  });

  await migrateLocalData();

  // Realtime sync for multi-device live updates
  db.channel('tasks-realtime')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' },
      (payload) => {
        if (_realtimeIgnore) return;
        if (payload.eventType === 'INSERT') {
          const t = payload.new;
          if (tasks.find(x => x.id === t.id)) return;
          const task = { ...t, createdAt: t.created_at, remindAt: t.remind_at ? new Date(t.remind_at).getTime() : null };
          tasks.push(task);
          smoothHeightChange(() => appendTaskToDOM(task));
        } else if (payload.eventType === 'UPDATE') {
          const t = payload.new;
          const task = tasks.find(x => x.id === t.id);
          if (!task) return;
          task.completed = t.completed;
          task.important = t.important;
          task.remindAt = t.remind_at ? new Date(t.remind_at).getTime() : null;

          // Selective DOM update — no full re-render
          const li = taskList.querySelector(`[data-id="${t.id}"]`);
          if (li) {
            li.classList.toggle('completed', task.completed);
            const cb = li.querySelector('.checkbox');
            if (cb) cb.setAttribute('aria-checked', task.completed ? 'true' : 'false');
            const btn = li.querySelector('.btn-important');
            if (btn) {
              if (task.important) { btn.classList.add('active'); btn.innerHTML = STAR_FILLED; btn.setAttribute('aria-label', '取消重要标记'); }
              else { btn.classList.remove('active'); btn.innerHTML = STAR_OUTLINE; btn.setAttribute('aria-label', '标记为重要'); }
            }
            const meta = li.querySelector('.task-meta');
            if (meta) {
              const oldBadge = meta.querySelector('.badge-important');
              if (task.important && !oldBadge) {
                const b = document.createElement('span'); b.className = 'badge-important'; b.textContent = '重要'; meta.appendChild(b);
              } else if (!task.important && oldBadge) {
                oldBadge.remove();
              }
            }
          }
          updateFooter();
        } else if (payload.eventType === 'DELETE') {
          const id = payload.old.id;
          const li = taskList.querySelector(`[data-id="${id}"]`);
          if (!li) return;
          tasks = tasks.filter(x => x.id !== id);
          li.style.opacity = '0';
          li.style.pointerEvents = 'none';
          setTimeout(() => { if (li.parentNode) li.remove(); updateUI(); }, 250);
        }
      }
    )
    .subscribe();
})();
</script>
